<title>Project Console</title>

--cinnabar-500:oklch(0.610 0.200 34);--cinnabar-600:oklch(0.540 0.190 32);--cinnabar-700:oklch(0.450 0.160 30);--cinnabar-900:oklch(0.300 0.095 30);

--bg-page:var(--paper-100);--bg-surface:var(--paper-50);--bg-sunken:var(--paper-200);--bg-inverse:var(--ink-900);
--bg-accent:var(--cinnabar-500);--bg-accent-soft:var(--cinnabar-100);
--fg-1:var(--ink-900);--fg-2:var(--umber-700);--fg-3:var(--stone-500);--fg-inverse:var(--paper-50);

--selection:var(--ochre-200);
--success:var(--verdigris-700);--success-soft:var(--verdigris-100);
--warning:var(--ochre-700);--warning-soft:var(--ochre-100);
--danger:var(--cinnabar-700);--danger-soft:var(--cinnabar-100);
--info:var(--lapis-700);--info-soft:var(--lapis-100);
--glass-bg:oklch(0.968 0.013 82 / 0.72);
--shadow-1:0 1px 0 oklch(0.30 0.03 50 / 0.06),0 1px 3px oklch(0.30 0.03 50 / 0.06);
--shadow-2:0 2px 4px oklch(0.30 0.03 50 / 0.05),0 10px 28px -6px oklch(0.30 0.03 50 / 0.14);
--shadow-3:0 4px 8px oklch(0.30 0.03 50 / 0.06),0 28px 64px -12px oklch(0.25 0.03 50 / 0.28);

--text-lg:clamp(22px,1.6vw + 14px,28px);--text-xl:clamp(28px,2.4vw + 16px,40px);--text-2xl:clamp(36px,4vw + 16px,64px);

--gutter:clamp(20px,4vw,56px);--page-max:1360px;--measure:64ch;
--radius-sm:4px;--radius-md:8px;--radius-lg:16px;--radius-pill:999px;
--hairline:1px;--rule:2px;

}
/* Ink — the same system at night. Stamped and unstamped viewers both. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg-page:var(--ink-950);--bg-surface:var(--ink-900);--bg-sunken:oklch(0.125 0.008 50);--bg-inverse:var(--paper-100);
--bg-accent-soft:oklch(0.30 0.07 32);
--fg-1:var(--paper-100);--fg-2:var(--paper-300);--fg-3:var(--stone-400);--fg-inverse:var(--ink-900);--fg-accent:var(--cinnabar-400);
--text-body:var(--fg-1);--text-muted:var(--fg-2);--text-subtle:var(--fg-3);
--surface-card:var(--ink-900);--surface-overlay:oklch(0.10 0.008 50 / 0.6);
--line-1:oklch(0.968 0.013 82 / 0.12);--line-2:oklch(0.968 0.013 82 / 0.24);--line-strong:var(--paper-100);
--accent:var(--cinnabar-500);--accent-hover:var(--cinnabar-400);--thread:var(--cinnabar-400);--focus-ring:var(--cinnabar-400);
--selection:oklch(0.45 0.09 70);
--success:var(--verdigris-200);--success-soft:oklch(0.28 0.04 182);
--warning:var(--ochre-400);--warning-soft:oklch(0.30 0.05 74);
--danger:var(--cinnabar-300);--danger-soft:oklch(0.30 0.07 32);
--info:var(--lapis-200);--info-soft:oklch(0.28 0.05 264);
--glass-bg:oklch(0.155 0.010 50 / 0.7);
--shadow-1:0 1px 0 oklch(0 0 0 / 0.3);--shadow-2:0 10px 28px -6px oklch(0 0 0 / 0.5);--shadow-3:0 28px 64px -12px oklch(0 0 0 / 0.7);
}}
:root[data-theme="dark"]{
--bg-page:var(--ink-950);--bg-surface:var(--ink-900);--bg-sunken:oklch(0.125 0.008 50);--bg-inverse:var(--paper-100);
--bg-accent-soft:oklch(0.30 0.07 32);
--fg-1:var(--paper-100);--fg-2:var(--paper-300);--fg-3:var(--stone-400);--fg-inverse:var(--ink-900);--fg-accent:var(--cinnabar-400);
--text-body:var(--fg-1);--text-muted:var(--fg-2);--text-subtle:var(--fg-3);
--surface-card:var(--ink-900);--surface-overlay:oklch(0.10 0.008 50 / 0.6);
--line-1:oklch(0.968 0.013 82 / 0.12);--line-2:oklch(0.968 0.013 82 / 0.24);--line-strong:var(--paper-100);
--accent:var(--cinnabar-500);--accent-hover:var(--cinnabar-400);--thread:var(--cinnabar-400);--focus-ring:var(--cinnabar-400);
--selection:oklch(0.45 0.09 70);
--success:var(--verdigris-200);--success-soft:oklch(0.28 0.04 182);
--warning:var(--ochre-400);--warning-soft:oklch(0.30 0.05 74);
--danger:var(--cinnabar-300);--danger-soft:oklch(0.30 0.07 32);
--info:var(--lapis-200);--info-soft:oklch(0.28 0.05 264);
--glass-bg:oklch(0.155 0.010 50 / 0.7);
--shadow-1:0 1px 0 oklch(0 0 0 / 0.3);--shadow-2:0 10px 28px -6px oklch(0 0 0 / 0.5);--shadow-3:0 28px 64px -12px oklch(0 0 0 / 0.7);
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg-page);color:var(--text-body);font:400 var(--text-base)/1.45 var(--font-display);
-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--selection)}
:focus-visible{outline:none;box-shadow:var(--shadow-focus);border-radius:var(--radius-sm)}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}

.wrap{max-width:var(--page-max);margin:0 auto;padding-inline:var(--gutter)}

/* —— header: the only fixed element —— */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass-bg);backdrop-filter:saturate(1.4) blur(14px);
border-bottom:var(--hairline) solid var(--line-1)}
.hdr__in{display:flex;align-items:baseline;gap:var(--space-7);flex-wrap:wrap;padding-block:var(--space-5)}
.wordmark{font-family:var(--font-display);font-weight:800;font-size:var(--text-lg);letter-spacing:var(--tracking-monument);line-height:1}
.wordmark .stop{color:var(--accent)}
.stamp{margin-left:auto;font:var(--text-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);
text-transform:uppercase;color:var(--text-subtle);white-space:nowrap}

/* —— tabs: line variant, indicator glides —— */
.tabs{position:relative;display:flex;gap:var(--space-6);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;padding:0 0 var(--space-3);cursor:pointer;white-space:nowrap;
font-family:var(--font-display);font-weight:500;font-size:var(--text-sm);letter-spacing:var(--tracking-tight);
color:var(--text-subtle);transition:color var(--dur-quick) var(--ease-drift)}
.tab:hover{color:var(--text-body)}
.tab[aria-selected="true"]{color:var(--text-body)}
.tab__n{font-family:var(--font-mono);font-size:var(--text-micro);color:var(--text-subtle);margin-left:var(--space-2)}
.tab[aria-selected="true"] .tab__n{color:var(--accent)}
.tabs__ind{position:absolute;bottom:0;left:0;height:var(--rule);background:var(--thread);
transition:transform var(--dur-base) var(--ease-drift),width var(--dur-base) var(--ease-drift);transform-origin:left}

main{padding-block:var(--space-8) var(--space-9);display:block}
.view[hidden]{display:none}
.view{display:grid;gap:var(--space-6)}

/* —— eyebrow / meta —— */
.eyebrow{font:500 var(--text-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}
.meta{font:400 var(--text-xs)/1.4 var(--font-mono);color:var(--text-subtle)}
.serif{font:400 var(--text-read)/var(--leading-read) var(--font-serif)}
.voice{font:400 var(--text-md)/var(--leading-normal) var(--font-serif);font-style:italic;color:var(--text-muted)}

/* —— badges —— */
.badge{display:inline-flex;align-items:center;gap:var(--space-2);padding:3px var(--space-3);border-radius:var(--radius-sm);
font:500 var(--text-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;
border:var(--hairline) solid var(--line-2);color:var(--text-muted);white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:var(--radius-pill);background:currentColor}
.badge--accent{color:var(--fg-accent);border-color:color-mix(in oklab,var(--accent) 45%,transparent);background:var(--bg-accent-soft)}
.badge--success{color:var(--success);border-color:color-mix(in oklab,var(--success) 40%,transparent);background:var(--success-soft)}
.badge--warning{color:var(--warning);border-color:color-mix(in oklab,var(--warning) 40%,transparent);background:var(--warning-soft)}
.badge--info{color:var(--info);border-color:color-mix(in oklab,var(--info) 40%,transparent);background:var(--info-soft)}
.badge--danger{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 45%,transparent);background:var(--danger-soft)}
.badge--pulse .dot{animation:ln-pulse 2.4s var(--ease-settle) infinite}
@keyframes ln-pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* —— tags: anchors, and the relation reveal —— */
.tags{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.tag{display:inline-block;padding:2px var(--space-3);border:var(--hairline) solid var(--line-2);border-radius:var(--radius-pill);
font:400 var(--text-micro)/1.5 var(--font-mono);color:var(--text-muted);transition:border-color var(--dur-quick) var(--ease-drift)}
.tag--related{border-color:var(--thread);color:var(--fg-accent)}

/* —— cards: the inbox only —— */
.card{position:relative;background:var(--surface-card);border:var(--hairline) solid var(--line-1);border-radius:var(--radius-md);
padding:var(--space-6);display:grid;gap:var(--space-5);animation:ln-rise var(--dur-slow) var(--ease-drift) both}
@keyframes ln-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:0 0 auto;height:var(--rule);background:var(--thread);border-radius:var(--radius-md) var(--radius-md) 0 0;
transform:scaleX(0);transform-origin:left;transition:transform var(--dur-slow) var(--ease-drift)}
.card--live::before{transform:scaleX(1)}
.card__head{display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap}
.card__title{font-family:var(--font-display);font-weight:600;font-size:var(--text-xl);line-height:var(--leading-tight);
letter-spacing:var(--tracking-display);text-wrap:balance}
.card__q{font:400 var(--text-read)/var(--leading-read) var(--font-serif);max-width:var(--measure)}
.assume{display:flex;gap:var(--space-4);align-items:baseline;padding-left:var(--space-5);border-left:var(--rule) solid var(--line-2)}
.assume__k{font:500 var(--text-micro)/1.6 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);white-space:nowrap}
.assume__v{font:400 var(--text-base)/var(--leading-normal) var(--font-serif);font-style:italic;color:var(--text-muted)}

/* —— options —— */
.opts{display:grid;gap:var(--space-3);border-top:var(--hairline) solid var(--line-1);padding-top:var(--space-5)}
.opt{display:grid;grid-template-columns:auto 1fr;gap:var(--space-4);padding:var(--space-4);border-radius:var(--radius-md);
border:var(--hairline) solid transparent;cursor:pointer;transition:background var(--dur-quick) var(--ease-drift),border-color var(--dur-quick) var(--ease-drift)}
.opt:hover{background:var(--bg-sunken)}
.opt input{appearance:none;width:16px;height:16px;margin:4px 0 0;border:var(--hairline) solid var(--line-2);border-radius:var(--radius-pill);
background:var(--bg-surface);cursor:pointer;transition:border-color var(--dur-quick) var(--ease-drift)}
.opt input:checked{border-color:var(--accent);background:radial-gradient(circle at center,var(--accent) 0 3.5px,transparent 3.7px)}
.opt:has(input:checked){border-color:var(--line-2);background:var(--bg-sunken)}
.opt__label{font-family:var(--font-display);font-weight:600;font-size:var(--text-base);letter-spacing:var(--tracking-tight);
display:flex;gap:var(--space-3);align-items:baseline;flex-wrap:wrap}
.opt__sum{font:400 var(--text-base)/var(--leading-normal) var(--font-serif);color:var(--text-muted);margin-top:2px}
.opt__trade{font:400 var(--text-xs)/1.5 var(--font-mono);color:var(--text-subtle);margin-top:var(--space-2)}
.rec{font:500 var(--text-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-accent)}

/* —— controls —— */
.field{display:grid;gap:var(--space-3)}
textarea{width:100%;min-height:76px;resize:vertical;padding:var(--space-4);background:var(--bg-surface);color:var(--text-body);
border:var(--hairline) solid var(--line-2);border-radius:var(--radius-md);font:400 var(--text-base)/var(--leading-normal) var(--font-serif)}
textarea:focus{outline:none;border-color:var(--line-strong);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 18%,transparent)}
.actions{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-3);
height:40px;padding:0 var(--space-6);border-radius:var(--radius-pill);border:var(--hairline) solid var(--line-strong);
background:var(--bg-inverse);color:var(--fg-inverse);font-family:var(--font-display);font-weight:600;font-size:var(--text-sm);
letter-spacing:var(--tracking-tight);transition:transform var(--dur-instant) var(--ease-settle)}
.btn::before{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;
transition:transform var(--dur-base) var(--ease-drift);z-index:0}
.btn>*{position:relative;z-index:1}
.btn:hover::before{transform:scaleX(1)}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn--ghost{background:none;color:var(--text-body);border-color:transparent}
.btn--ghost::before{display:none}
.btn--ghost:hover{color:var(--fg-accent)}

/* —— index rows: maps, reports —— */
.index{border-top:var(--hairline) solid var(--line-1)}
.row{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:var(--space-5);align-items:baseline;
padding-block:var(--space-5);border-bottom:var(--hairline) solid var(--line-1);
transition:opacity var(--dur-quick) var(--ease-drift)}
.row::after{content:"";position:absolute;inset:auto 0 -1px;height:var(--rule);background:var(--thread);
transform:scaleX(0);transform-origin:left;transition:transform var(--dur-slow) var(--ease-drift)}
.row:hover::after,.row.is-related::after{transform:scaleX(1)}
.row.is-dim{opacity:.35}
.row__i{font:400 var(--text-xs)/1.6 var(--font-mono);color:var(--text-subtle);min-width:2.5ch}
.row__main{display:grid;gap:var(--space-3);min-width:0}
.row__t{font-family:var(--font-display);font-weight:600;font-size:var(--text-lg);line-height:var(--leading-snug);
letter-spacing:var(--tracking-display);display:inline-flex;align-items:baseline;gap:var(--space-3);
transition:transform var(--dur-base) var(--ease-drift)}
.row:hover .row__t{transform:translateX(10px)}
.row__t .ext{color:var(--text-subtle);font-size:var(--text-sm);transition:transform var(--dur-base) var(--ease-drift),color var(--dur-quick) var(--ease-drift)}
.row:hover .row__t .ext{transform:translate(4px,-4px);color:var(--fg-accent)}
.row__sub{font:400 var(--text-md)/var(--leading-normal) var(--font-serif);font-style:italic;color:var(--text-muted)}
.row__side{display:grid;gap:var(--space-3);justify-items:end;text-align:right}
.row__why{display:grid;gap:var(--space-1);padding-top:var(--space-2)}
.row__why .commit{font:400 var(--text-xs)/1.6 var(--font-mono);color:var(--text-subtle)}
.row__why .commit b{color:var(--fg-accent);font-weight:400}

/* —— claim bar: four pigments, one scale —— */
.claims{display:grid;gap:var(--space-3);min-width:168px}
.bar{display:flex;height:var(--rule);background:var(--line-1);overflow:hidden}
.bar span{display:block;height:100%}
.bar .s-verified{background:var(--success)}
.bar .s-partial{background:var(--warning)}
.bar .s-unverified{background:var(--stone-400)}
.bar .s-planned{background:var(--info)}
.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;font:400 var(--text-micro)/1.4 var(--font-mono);color:var(--text-subtle)}
.legend i{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:var(--radius-pill);vertical-align:middle}

/* —— evidence —— */
details.ev{border-top:var(--hairline) solid var(--line-1);padding-top:var(--space-4)}
details.ev>summary{cursor:pointer;list-style:none;font:500 var(--text-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);
text-transform:uppercase;color:var(--text-subtle)}
details.ev>summary::-webkit-details-marker{display:none}
details.ev>summary:hover{color:var(--fg-accent)}
details.ev[open]>summary{margin-bottom:var(--space-5)}
.ev__body{display:grid;gap:var(--space-5)}
.md{font:400 var(--text-base)/var(--leading-read) var(--font-serif);max-width:var(--measure);display:grid;gap:var(--space-4)}
.md h3{font-family:var(--font-display);font-weight:600;font-size:var(--text-base);letter-spacing:var(--tracking-tight)}
.md code{font:400 0.92em/1.4 var(--font-mono);background:var(--bg-sunken);padding:1px 4px;border-radius:var(--radius-sm)}
.md ul{display:grid;gap:var(--space-2)}
.md li{padding-left:var(--space-5);position:relative}
.md li::before{content:"·";position:absolute;left:var(--space-2);color:var(--accent)}
.md a{border-bottom:var(--hairline) solid var(--line-2)}
.md a:hover{color:var(--fg-accent);border-color:var(--thread)}
pre{margin:0;overflow-x:auto;background:var(--bg-sunken);border:var(--hairline) solid var(--line-1);border-radius:var(--radius-md);
padding:var(--space-4);font:400 var(--text-xs)/1.6 var(--font-mono)}
.diff{display:grid;gap:var(--space-2)}
.diff__p{font:400 var(--text-micro)/1.4 var(--font-mono);color:var(--text-subtle)}
.diff pre b{display:block;font-weight:400}
.diff pre .add{color:var(--success)}
.diff pre .del{color:var(--danger)}
.diff pre .hunk{color:var(--text-subtle)}

/* —— figures: inline pictures on a map or report row —— */
.figs{display:grid;gap:var(--space-6)}
.figs__g{display:grid;gap:var(--space-4)}
.figs__h{font:500 var(--text-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}
.figs__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:var(--space-5)}
.fig{margin:0;display:grid;gap:var(--space-3);align-content:start;min-width:0}
.fig__btn{appearance:none;display:block;width:100%;padding:var(--space-3);cursor:zoom-in;background:var(--bg-sunken);
border:var(--hairline) solid var(--line-1);border-radius:var(--radius-md);transition:border-color var(--dur-quick) var(--ease-drift)}
.fig__btn:hover{border-color:var(--thread)}
.fig__btn:focus-visible{outline:none;box-shadow:var(--shadow-focus)}
.fig__btn img{display:block;width:100%;height:auto;max-height:260px;object-fit:contain;object-position:left top}
.fig figcaption{font:400 var(--text-sm)/var(--leading-normal) var(--font-serif);color:var(--text-muted)}
.fig figcaption b{font:500 var(--text-xs)/1.4 var(--font-mono);color:var(--text-body);margin-right:var(--space-3)}
.lb[hidden]{display:none}
.lb{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:auto 1fr;background:var(--surface-overlay);
-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:calc(var(--space-5) + env(safe-area-inset-top,0px)) var(--space-5) calc(var(--space-5) + env(safe-area-inset-bottom,0px))}
.lb__bar{display:flex;gap:var(--space-4);align-items:center;justify-content:space-between;background:var(--bg-surface);
border:var(--hairline) solid var(--line-1);border-bottom:0;border-radius:var(--radius-md) var(--radius-md) 0 0;padding:var(--space-3) var(--space-4)}
.lb__cap{font:400 var(--text-sm)/1.4 var(--font-serif);color:var(--text-muted);min-width:0}
.lb__cap b{font:500 var(--text-xs)/1.4 var(--font-mono);color:var(--text-body);margin-right:var(--space-3)}
.lb__scroll{overflow:auto;background:var(--bg-sunken);border:var(--hairline) solid var(--line-1);border-radius:0 0 var(--radius-md) var(--radius-md);min-height:0}
.lb__scroll img{display:block;max-width:none;margin:var(--space-4)}
.mermaid{background:var(--bg-sunken);border:var(--hairline) solid var(--line-1);border-radius:var(--radius-md);padding:var(--space-5);
overflow-x:auto;text-align:center;font-family:var(--font-mono);font-size:var(--text-xs)}

/* —— section headings, empties, archive —— */
.sec{display:grid;gap:var(--space-5)}
.sec__h{font-family:var(--font-display);font-weight:600;font-size:var(--text-lg);letter-spacing:var(--tracking-display)}
.empty{display:grid;gap:var(--space-4);padding-block:var(--space-8);border-top:var(--hairline) solid var(--line-1);max-width:var(--measure)}
.empty p{font:400 var(--text-md)/var(--leading-normal) var(--font-serif);font-style:italic;color:var(--text-muted)}
.empty code{font:400 var(--text-xs)/1.8 var(--font-mono);color:var(--text-subtle)}
details.arch{border-top:var(--hairline) solid var(--line-1);padding-top:var(--space-4)}
details.arch>summary{cursor:pointer;list-style:none;font:400 var(--text-xs)/1.4 var(--font-mono);color:var(--text-subtle)}
details.arch>summary::-webkit-details-marker{display:none}
details.arch>summary:hover{color:var(--fg-accent)}
.arch__list{display:grid;gap:var(--space-3);padding-top:var(--space-5)}
.arch__row{display:grid;grid-template-columns:auto 1fr auto;gap:var(--space-4);align-items:baseline;
font:400 var(--text-xs)/1.5 var(--font-mono);color:var(--text-subtle)}
.arch__row b{font-family:var(--font-display);font-weight:500;font-size:var(--text-sm);color:var(--text-muted)}

/* —— toast: bottom-left, ink —— */
.toasts{position:fixed;left:var(--gutter);bottom:var(--space-6);z-index:40;display:grid;gap:var(--space-3);max-width:min(380px,90vw)}
.toast{background:var(--ink-900);color:var(--paper-100);border-radius:var(--radius-md);box-shadow:var(--shadow-3);
padding:var(--space-4) var(--space-5);display:grid;gap:var(--space-2);animation:ln-rise var(--dur-base) var(--ease-drift) both}
.toast b{font-family:var(--font-display);font-weight:600;font-size:var(--text-sm)}
.toast span{font:400 var(--text-xs)/1.5 var(--font-mono);color:var(--stone-400)}
.toast--warning b{color:var(--ochre-400)}

@media (max-width:640px){
  .row{grid-template-columns:auto 1fr}
  .row__side{grid-column:2;justify-items:start;text-align:left}
  .claims{min-width:0}
  .hdr__in{gap:var(--space-5)}
  .stamp{margin-left:0;width:100%}
}

/* —— graph lanes: semantic tokens, so both themes carry them —— */
:root{--lane-0:var(--accent);--lane-1:var(--info);--lane-2:var(--success);--lane-3:var(--warning);--lane-4:var(--fg-3);--lane-5:var(--danger);
--hdr-h:112px;--row-h:34px}

/* —— state strip: where HEAD is, said once at the top of Now —— */
.state{display:grid;gap:var(--space-4);padding-bottom:var(--space-6);border-bottom:var(--hairline) solid var(--line-1)}
.state__ver{font:500 var(--text-xl)/1 var(--font-mono);letter-spacing:-0.02em;font-variant-numeric:tabular-nums;display:flex;gap:var(--space-5);align-items:baseline;flex-wrap:wrap}
.state__ver .br{color:var(--fg-accent)}
.state__s{font:400 var(--text-md)/var(--leading-snug) var(--font-serif);color:var(--text-body);max-width:var(--measure);text-wrap:balance}
.state__meta{display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-5);align-items:center}
.chip{display:inline-flex;align-items:center;gap:var(--space-2);padding:2px var(--space-3);border-radius:var(--radius-pill);
border:var(--hairline) solid var(--line-2);font:400 var(--text-xs)/1.5 var(--font-mono);color:var(--text-muted);white-space:nowrap;
background:none;cursor:default;max-width:100%;overflow:hidden;text-overflow:ellipsis}
button.chip,a.chip{cursor:pointer;transition:border-color var(--dur-quick) var(--ease-drift),color var(--dur-quick) var(--ease-drift)}
button.chip:hover,a.chip:hover{border-color:var(--thread);color:var(--fg-accent)}
.chip--branch::before{content:"";width:6px;height:6px;border-radius:var(--radius-pill);background:var(--thread)}
.chip--tag{border-style:dashed}
.chip--remote{color:var(--text-subtle)}

/* —— Now: summary column and the attention rail —— */
.now{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:var(--space-8);align-items:start}
.now__main,.now__side{display:grid;gap:var(--space-8);min-width:0}
.pane{display:grid;gap:var(--space-4);min-width:0}
.pane__h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4);
padding-bottom:var(--space-3);border-bottom:var(--hairline) solid var(--line-1)}
.pane__h h2{font-family:var(--font-display);font-weight:600;font-size:var(--text-base);letter-spacing:var(--tracking-tight)}
.pane__more{font:400 var(--text-xs)/1.4 var(--font-mono);color:var(--text-subtle);background:none;border:0;padding:0;cursor:pointer}
.pane__more:hover{color:var(--fg-accent)}
.quiet{font:400 var(--text-base)/var(--leading-normal) var(--font-serif);font-style:italic;color:var(--text-muted)}

/* briefing */
.brief{background:var(--surface-card);border:var(--hairline) solid var(--line-1);border-radius:var(--radius-md);padding:var(--space-6);display:grid;gap:var(--space-5)}
.brief__top{display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap}
.brief__nav{margin-left:auto;display:flex;gap:var(--space-2);align-items:center}
.brief__nav button{appearance:none;width:30px;height:30px;border-radius:var(--radius-pill);border:var(--hairline) solid var(--line-2);
background:none;color:var(--text-body);cursor:pointer;font:400 var(--text-sm)/1 var(--font-mono)}
.brief__nav button:hover:not(:disabled){border-color:var(--thread);color:var(--fg-accent)}
.brief__nav button:disabled{opacity:.35;cursor:default}
.brief__sec{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:var(--space-4)}
.brief__k{font:500 var(--text-micro)/2.1 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}
.brief__k--blocked{color:var(--danger)}
.brief .prose{font-size:var(--text-base)}
.brief__title{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--text-body);
  font-family:var(--font-display);font-weight:700;font-size:var(--text-xl);line-height:var(--leading-tight);letter-spacing:var(--tracking-display);text-wrap:balance}
.brief__title:hover{color:var(--fg-accent)}
.brief__adr{appearance:none;background:none;border:0;padding:0 0 var(--space-3);text-align:left;cursor:pointer;color:inherit;display:grid;gap:var(--space-1);width:100%}
.brief__adr:hover .brief__adr-t{color:var(--fg-accent)}
.brief__adr-t{font-family:var(--font-display);font-weight:600;font-size:var(--text-base);letter-spacing:var(--tracking-tight)}
.brief__adr-s{font:400 var(--text-sm)/var(--leading-normal) var(--font-serif);color:var(--text-muted)}
.todo__i--done span{text-decoration:line-through;text-decoration-color:var(--line-2);color:var(--text-muted)}
.todo__i--done::before{background:var(--line-2)}
.brief__old{font:400 var(--text-xs)/1.5 var(--font-mono);color:var(--warning);background:var(--warning-soft);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);justify-self:start}

/* lists on Now */
.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2) var(--space-4);align-items:baseline;
padding-block:var(--space-4);border-bottom:var(--hairline) solid var(--line-1);text-align:left;background:none;border-inline:0;border-top:0;
color:inherit;font:inherit;width:100%}
button.li{cursor:pointer}
button.li:hover .li__t{color:var(--fg-accent)}
.li__link{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.li__link:hover{color:var(--fg-accent)}
.li__t{font-family:var(--font-display);font-weight:600;font-size:var(--text-base);letter-spacing:var(--tracking-tight);
transition:color var(--dur-quick) var(--ease-drift);min-width:0;overflow-wrap:anywhere}
.li__v{font:400 var(--text-xs)/1.5 var(--font-mono);color:var(--fg-accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.li__sub{grid-column:1 / -1;font:400 var(--text-sm)/var(--leading-normal) var(--font-serif);color:var(--text-muted);min-width:0}
.li__meta{min-width:0;grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);align-items:center}
.li__meta .chip{display:block;min-width:0}
.todo{display:grid;gap:var(--space-1)}
.todo__h{font:500 var(--text-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);padding-top:var(--space-4)}
.todo__i{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-4);align-items:baseline;padding-block:var(--space-3);
font:400 var(--text-base)/var(--leading-normal) var(--font-serif)}
.todo__i::before{content:"";width:11px;height:11px;border:var(--hairline) solid var(--line-2);border-radius:2px;transform:translateY(1px)}
.todo__i a{border-bottom:var(--hairline) solid var(--line-2)}
.todo__i a:hover{color:var(--fg-accent);border-color:var(--thread)}
.todo__i code,.li code{font:400 0.88em/1.4 var(--font-mono);background:var(--bg-sunken);padding:1px 4px;border-radius:var(--radius-sm)}
.ab{font:400 var(--text-xs)/1.5 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text-subtle);white-space:nowrap}
.ab b{font-weight:500;color:var(--success)}
.ab i{font-style:normal;color:var(--warning)}
.attn{display:grid;gap:var(--space-3)}
.attn__i{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-4);align-items:baseline;font:400 var(--text-sm)/var(--leading-normal) var(--font-serif);color:var(--text-muted)}
.attn__i .dot{width:7px;height:7px;border-radius:var(--radius-pill);background:var(--fg-3);transform:translateY(-1px)}
.attn__i--warn .dot{background:var(--warning)}
.attn__i--bad .dot{background:var(--danger)}
.attn__i--ok .dot{background:var(--success)}
.attn__i button{appearance:none;background:none;border:0;padding:0;font:inherit;color:var(--text-body);cursor:pointer;text-align:left;border-bottom:var(--hairline) solid var(--line-2)}
.attn__i button:hover{color:var(--fg-accent);border-color:var(--thread)}

/* —— Board: docky's TODO.md as columns; the page only reads it —— */
.bd__bar{display:flex;flex-wrap:wrap;gap:var(--space-3) var(--space-5);align-items:center}
.bd__bar h2{font-family:var(--font-display);font-weight:600;font-size:var(--text-lg);letter-spacing:var(--tracking-display);margin-right:auto}
.bd__tags{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.chip[aria-pressed="true"]{border-color:var(--thread);color:var(--fg-accent);background:var(--bg-accent-soft)}
.bd__jump{display:none;gap:var(--space-2);overflow-x:auto;scrollbar-width:none}
.bd__jump::-webkit-scrollbar{display:none}
.bd__jump .chip{flex:none}
.bd{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:var(--space-4);align-items:start;
overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;padding-bottom:var(--space-3)}
.bd__col{display:grid;gap:var(--space-3);align-content:start;min-width:0;scroll-snap-align:start;padding:var(--space-4);
border-radius:var(--radius-md);background:var(--bg-sunken);border-top:var(--rule) solid transparent}
.bd__col--doing{border-top-color:var(--thread)}
.bd__col--review{border-top-color:var(--info)}
.bd__col--closed{background:none;border:var(--hairline) dashed var(--line-2)}
.bd__h{display:flex;align-items:baseline;gap:var(--space-3)}
.bd__h b{font-family:var(--font-display);font-weight:600;font-size:var(--text-base);letter-spacing:var(--tracking-tight)}
.bd__n{font:400 var(--text-xs)/1 var(--font-mono);color:var(--text-subtle);font-variant-numeric:tabular-nums}
.bd__n--over{color:var(--warning)}
.bd__hint{font:400 var(--text-xs)/1.4 var(--font-serif);font-style:italic;color:var(--text-subtle)}
.card-k{display:grid;gap:var(--space-3);padding:var(--space-4);border-radius:var(--radius-sm);background:var(--surface-card);
border:var(--hairline) solid var(--line-1);box-shadow:var(--shadow-1);min-width:0}
.card-k--blocked{border-left:var(--rule) solid var(--danger)}
.card-k--closed{box-shadow:none;background:none}
.card-k--closed .card-k__t{text-decoration:line-through;text-decoration-color:var(--line-2);color:var(--text-muted)}
.card-k__t{font:400 var(--text-sm)/var(--leading-normal) var(--font-serif);overflow-wrap:anywhere}
.card-k__t code{font:400 0.88em/1.4 var(--font-mono);background:var(--bg-sunken);padding:1px 4px;border-radius:var(--radius-sm)}
.card-k a{border-bottom:var(--hairline) solid var(--line-2)}
.card-k a:hover{color:var(--fg-accent);border-color:var(--thread)}
.card-k__m{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-3);align-items:center}
.card-k__m .chip{font-size:var(--text-micro)}
.card-k__age{font:400 var(--text-micro)/1.4 var(--font-mono);color:var(--text-subtle);font-variant-numeric:tabular-nums}
button.card-k__age{appearance:none;background:none;border:0;padding:0;cursor:pointer}
button.card-k__age:hover{color:var(--fg-accent)}
.card-k__age--stuck{color:var(--warning)}
.card-k__cat{font:500 var(--text-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}
.card-k--flash{animation:ck-flash 1.4s var(--ease-drift)}
@keyframes ck-flash{0%{box-shadow:0 0 0 3px var(--focus-ring)}100%{box-shadow:var(--shadow-1)}}
.card-k__wait{cursor:pointer;font:inherit;font-size:var(--text-micro)}
.card-k .badge{white-space:normal;max-width:100%;text-align:left}
.stg{display:flex;flex-wrap:wrap;gap:var(--space-2);list-style:none;margin:0;padding:0}
.stg__s{font:400 var(--text-micro)/1.5 var(--font-mono);padding:0 var(--space-3);border-radius:var(--radius-pill);
border:var(--hairline) solid var(--line-2);color:var(--text-subtle)}
.stg__s--done{background:var(--bg-sunken);border-color:transparent;text-decoration:line-through;text-decoration-color:var(--line-2)}
.stg__s--now{border-color:var(--thread);color:var(--fg-accent);background:var(--bg-accent-soft);font-weight:500}
.stg__s--long{border-style:dashed}
.stg__s--long::after{content:" ⧗"}
.stg__s--done.stg__s--long{border-style:solid}
.sub summary{display:flex;align-items:center;gap:var(--space-3);cursor:pointer;list-style:none}
.sub summary::-webkit-details-marker{display:none}
.sub__bar{flex:1;height:4px;border-radius:var(--radius-pill);background:var(--bg-sunken);overflow:hidden;max-width:120px}
.sub__bar span{display:block;height:100%;background:var(--success)}
.sub ul{list-style:none;margin:var(--space-3) 0 0;padding:0;display:grid;gap:var(--space-2)}
.sub__i{font:400 var(--text-xs)/1.4 var(--font-serif);padding-left:var(--space-5);position:relative;color:var(--text-body)}
.sub__i::before{content:"";position:absolute;left:0;top:4px;width:8px;height:8px;border:var(--hairline) solid var(--line-2);border-radius:2px}
.sub__i--done{color:var(--text-subtle);text-decoration:line-through;text-decoration-color:var(--line-2)}
.sub__i--done::before{background:var(--success);border-color:var(--success)}
.ep-dot{display:inline-block;width:7px;height:7px;border-radius:var(--radius-pill);flex:none}
.ep-0{background:var(--cinnabar-500)}.ep-1{background:var(--ochre-500)}.ep-2{background:var(--verdigris-500)}.ep-3{background:var(--lapis-500)}.ep-4{background:var(--umber-600)}
.ep-chip{gap:var(--space-2)}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-3)}
.ep{appearance:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2) var(--space-4);align-items:center;text-align:left;cursor:pointer;
padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);border:var(--hairline) solid var(--line-1);background:var(--surface-card);color:var(--text-body)}
.ep:hover,.ep[aria-pressed="true"]{border-color:var(--thread)}
.ep__n{display:flex;align-items:center;gap:var(--space-3);font:600 var(--text-sm)/1.3 var(--font-display);min-width:0;overflow-wrap:anywhere}
.ep__bar{grid-column:1 / -1;display:flex;gap:2px;height:6px}
.ep__s{border-radius:2px;min-width:4px;background:var(--line-2)}
.ep__s--next{background:var(--stone-400)}.ep__s--doing{background:var(--thread)}.ep__s--review{background:var(--info)}.ep__s--closed{background:var(--success)}
.ep .card-k__age{grid-row:1;grid-column:2}
.bd__more{appearance:none;background:none;border:0;padding:0;cursor:pointer;justify-self:start;font:400 var(--text-xs)/1.4 var(--font-mono);color:var(--text-subtle)}
.bd__more:hover{color:var(--fg-accent)}
.bd__empty{font:400 var(--text-sm)/1.4 var(--font-serif);font-style:italic;color:var(--text-subtle);padding-block:var(--space-2)}
@media (max-width:1100px){.bd__jump{display:flex}}
@media (max-width:640px){.bd{grid-auto-columns:86%}}

/* —— Docs: index rail and reader —— */
.docs{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:var(--space-8);align-items:start}
.dnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr-h));max-height:calc(100vh - var(--hdr-h) - var(--space-6));overflow:auto;
padding-right:var(--space-3);overscroll-behavior:contain}
.dnav__in{display:grid;gap:var(--space-6)}
.dnav>summary{display:none}
.dnav__filter{width:100%;height:36px;padding:0 var(--space-4);border:var(--hairline) solid var(--line-2);border-radius:var(--radius-pill);
background:var(--bg-surface);color:var(--text-body);font:400 var(--text-sm)/1 var(--font-mono)}
.dnav__filter:focus{outline:none;border-color:var(--line-strong);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 18%,transparent)}
.dnav__g{display:grid;gap:var(--space-1)}
.dnav__h{font:500 var(--text-micro)/1.2 var(--font-mono);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle);
display:flex;justify-content:space-between;padding-bottom:var(--space-2)}
.dnav__i{appearance:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-3);align-items:baseline;width:100%;text-align:left;

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
"use strict";
/* The console reads its whole world from the database: every project-specific
   fact is a row or a field of the snapshot. Nothing below tests a project by name. */
const COLLECTIONS = ["proposals", "maps", "reports"];
const CLAIMS = ["verified", "partial", "unverified", "planned"];
const CLAIM_TONE = {verified: "success", partial: "warning", unverified: "neutral", planned: "info"};
const URGENCY_RANK = {blocking: 0, soon: 1, whenever: 2};
const VIEWS = ["now", "board", "docs", "history", "decisions", "exhibits"];
const ARTY = {
  proposals: "arty: file a proposal from a session that needs a judgement call",
  maps: "arty: register a map when a live picture of the code is published",
  reports: "arty: register a report when an analysis is published",
  snapshot: "arty sync --db DUMP --plan DIR, then write the batch it prints"
};

const state = {
  project: null, view: "now", canEdit: false, db: null, ready: false,
  snap: null, snapNote: "", brief: 0, doc: null, docFilter: "", asOf: null, commit: null, feature: null,
  boardTag: null, boardEpic: null, boardAll: false
};
COLLECTIONS.forEach(c => state[c] = []);
const el = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* —— formatting —— */
const toDate = v => new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? v + "T00:00" : v);
function fmtDate(v) {
  if (!v) return "";
  const d = toDate(v);
  if (isNaN(d)) return String(v);
  return d.toLocaleDateString("en-GB", {day: "numeric", month: "short", year: "numeric"});
}
function ago(v) {
  if (!v) return "";
  const days = Math.floor((Date.now() - new Date(v).getTime()) / 86400000);
  if (isNaN(days)) return "";
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  return days + " days ago";
}
function badge(text, tone, opts) {
  const o = opts || {};
  const cls = ["badge"];
  if (tone && tone !== "neutral") cls.push("badge--" + tone);
  if (o.pulse) cls.push("badge--pulse");
  return '<span class="' + cls.join(" ") + '">' + (o.dot || o.pulse ? '<i class="dot"></i>' : "") + esc(text) + "</span>";
}
function tags(anchors) {
  if (!anchors || !anchors.length) return "";
  return '<span class="tags">' + anchors.map(a => '<span class="tag">' + esc(a) + "</span>").join("") + "</span>";
}

/* —— a small markdown subset: agent-authored evidence, escaped first —— */
function md(src) {
  if (!src) return "";
  const blocks = [];
  String(src).split(/\n{2,}/).forEach(raw => {
    const b = raw.trim();
    if (!b) return;
    if (/^###?\s/.test(b)) { blocks.push("<h3>" + inline(b.replace(/^#+\s*/, "")) + "</h3>"); return; }
    if (/^([-*]\s)/m.test(b) && b.split("\n").every(l => /^[-*]\s/.test(l.trim()))) {
      blocks.push("<ul>" + b.split("\n").map(l => "<li>" + inline(l.trim().replace(/^[-*]\s*/, "")) + "</li>").join("") + "</ul>");
      return;
    }
    blocks.push("<p>" + inline(b) + "</p>");
  });
  return '<div class="md">' + blocks.join("") + "</div>";
}
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (m, c) => "<code>" + c + "</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1 <span class="ext">&#8599;</span></a>')
    .replace(/\n/g, " ");
}
function diff(d) {
  const lines = String(d.patch || "").split("\n").map(l => {
    const cls = l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : l.startsWith("@@") ? "hunk" : "";
    return "<b" + (cls ? ' class="' + cls + '"' : "") + ">" + esc(l || " ") + "</b>";
  }).join("");
  return '<div class="diff">' + (d.path ? '<div class="diff__p">' + esc(d.path) + "</div>" : "") + "<pre>" + lines + "</pre></div>";
}
function evidence(ev) {
  if (!ev) return "";
  const parts = [];
  if (ev.markdown) parts.push(md(ev.markdown));
  if (ev.mermaid) parts.push('<pre class="mermaid">' + esc(ev.mermaid) + "</pre>");
  (ev.diffs || []).forEach(d => parts.push(diff(d)));
  (ev.exhibits || []).forEach(u => parts.push('<div class="meta"><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + ' <span class="ext">&#8599;</span></a></div>'));
  if (!parts.length) return "";
  return '<details class="ev"><summary>Evidence</summary><div class="ev__body">' + parts.join("") + "</div></details>";
}

/* —— mermaid, themed to Sobar. Hex only: the library cannot parse oklch(). —— */
function diagramTheme() {
  const ink = isDark();
  return {
    startOnLoad: false, securityLevel: "strict", fontFamily: '"Fira Code",monospace', fontSize: 12,
    theme: "base",
    themeVariables: ink
      ? {background: "#1F1A16", primaryColor: "#2C2520", primaryTextColor: "#F8F3EA", primaryBorderColor: "#8C8378",
         lineColor: "#E0603C", secondaryColor: "#332A22", tertiaryColor: "#241E19", textColor: "#F8F3EA"}
      : {background: "#F2EDE3", primaryColor: "#FDFBF7", primaryTextColor: "#231C17", primaryBorderColor: "#8C8378",
         lineColor: "#B63E20", secondaryColor: "#F8F3EA", tertiaryColor: "#F2EDE3", textColor: "#231C17"}
  };
}
function isDark() {
  const stamped = document.documentElement.getAttribute("data-theme");
  if (stamped === "dark") return true;
  if (stamped === "light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
let diagramSeq = 0;
function drawDiagrams(scope) {
  if (typeof mermaid === "undefined") return;
  const nodes = [...scope.querySelectorAll("pre.mermaid")].filter(n => !n.dataset.drawn);
  if (!nodes.length) return;
  nodes.forEach(n => { n.dataset.drawn = "1"; n.dataset.src = n.dataset.src || n.textContent; n.id = "mmd-" + (++diagramSeq); });
  try {
    mermaid.initialize(diagramTheme());
    mermaid.run({nodes: nodes, suppressErrors: true});
  } catch (e) { /* the source stays readable as code */ }
}
function redrawDiagrams() {
  document.querySelectorAll("pre.mermaid[data-src]").forEach(n => {
    n.removeAttribute("data-processed"); n.removeAttribute("data-drawn"); n.textContent = n.dataset.src;
  });
  drawDiagrams(document);
}

/* —— relations: hovering one thing shows what it touches —— */
function wireRelations(scope) {
  const items = [...scope.querySelectorAll("[data-anchors]")];
  if (items.length < 2) return;
  const anchorsOf = node => { try { return JSON.parse(node.dataset.anchors || "[]"); } catch (e) { return []; } };
  items.forEach(node => {
    const mine = anchorsOf(node);
    if (!mine.length) return;
    node.addEventListener("mouseenter", () => {
      const set = new Set(mine);
      items.forEach(other => {
        if (other === node) return;
        const hit = anchorsOf(other).some(a => set.has(a));
        other.classList.toggle("is-related", hit);
        other.classList.toggle("is-dim", !hit);
      });
      scope.querySelectorAll(".tag").forEach(t => t.classList.toggle("tag--related", set.has(t.textContent)));
    });
    node.addEventListener("mouseleave", () => {
      items.forEach(o => o.classList.remove("is-related", "is-dim"));
      scope.querySelectorAll(".tag--related").forEach(t => t.classList.remove("tag--related"));

}

/* —— figures: rows may carry pictures published alongside the console —— */
const RENDERING = {pixelated: "pixelated", "crisp-edges": "crisp-edges", auto: "auto", smooth: "auto"};
function figSrc(src) {
  const s = String(src || "");
  if (/^https:\/\//.test(s)) return s;
  if (/^[A-Za-z0-9_][A-Za-z0-9_.\-\/]*$/.test(s) && !s.includes("..")) return s;
  return "";
}
function isInline(row) {
  return !row.url && (row.markdown || (row.figures || []).length);
}
function figures(row) {
  const list = (row.figures || []).filter(f => f && figSrc(f.src));
  if (!list.length) return "";
  const render = RENDERING[row.figure_rendering] || "auto";
  const groups = [];
  list.forEach(f => {
    const g = String(f.group || "");
    let bucket = groups.find(x => x.name === g);
    if (!bucket) groups.push(bucket = {name: g, items: []});
    bucket.items.push(f);
  });
  return '<div class="figs">' + groups.map(g =>
    '<section class="figs__g">' + (g.name ? '<h3 class="figs__h">' + esc(g.name) + "</h3>" : "") +
    '<div class="figs__grid">' + g.items.map(f => {
      const name = String(f.src).split("/").pop().replace(/\.[a-z0-9]+$/i, "");
      return '<figure class="fig"><button class="fig__btn" type="button" data-fig="' + esc(figSrc(f.src)) + '" data-render="' + render +
        '" data-name="' + esc(f.title || name) + '" data-cap="' + esc(f.caption || "") + '">' +
        '<img loading="lazy" decoding="async" src="' + esc(figSrc(f.src)) + '" alt="' + esc(f.caption || name) + '" style="image-rendering:' + render + '"></button>' +
        '<figcaption><b>' + esc(f.title || name) + "</b>" + esc(f.caption || "") + "</figcaption></figure>";
    }).join("") + "</div></section>").join("") + "</div>";
}
function inlineBody(row) {
  if (!isInline(row)) return "";
  const n = (row.figures || []).length;
  const label = n ? n + (n === 1 ? " figure" : " figures") : "Read";
  return '<details class="ev" data-key="' + esc("inline:" + row.id) + '"><summary>' + esc(label) + '</summary><div class="ev__body">' +
    (row.markdown ? md(row.markdown) : "") + figures(row) + "</div></details>";
}
function openFigure(btn) {
  const img = el("lb-img");
  img.src = btn.dataset.fig;
  img.style.imageRendering = btn.dataset.render || "auto";
  img.alt = btn.dataset.cap || btn.dataset.name || "";
  el("lb-cap").innerHTML = "<b>" + esc(btn.dataset.name) + "</b>" + esc(btn.dataset.cap);
  el("lightbox").hidden = false;
  el("lb-scroll").scrollTo(0, 0);
  el("lb-close").focus();
  openFigure.from = btn;
}
function closeFigure() {
  if (el("lightbox").hidden) return;
  el("lightbox").hidden = true;
  el("lb-img").removeAttribute("src");
  if (openFigure.from) openFigure.from.focus();
}
document.addEventListener("click", e => {
  const btn = e.target.closest && e.target.closest(".fig__btn");
  if (btn) { openFigure(btn); return; }
  if (e.target.id === "lightbox" || (e.target.closest && e.target.closest("#lb-close"))) closeFigure();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeFigure(); });

/* —— views —— */
function emptyState(kind, line) {
  return '<div class="empty"><p>' + esc(line) + "</p><code>" + esc(ARTY[kind]) + "</code></div>";
}

function keep(view) {
  const draft = {notes: {}, picked: {}, open: []};
  view.querySelectorAll("textarea").forEach(t => { if (t.value) draft.notes[t.id] = t.value; });
  view.querySelectorAll("input[type=radio]:checked").forEach(r => draft.picked[r.name] = r.value);
  view.querySelectorAll("details[open]").forEach(d => draft.open.push(d.dataset.key || d.querySelector("summary").textContent));
  return draft;
}
function restore(view, draft) {
  Object.keys(draft.notes).forEach(id => { const t = el(id); if (t) t.value = draft.notes[id]; });
  Object.keys(draft.picked).forEach(name => {
    const r = view.querySelector('input[name="' + name + '"][value="' + draft.picked[name] + '"]');
    if (r) r.checked = true;
  });
  view.querySelectorAll("details").forEach(d => {
    if (draft.open.includes(d.dataset.key || d.querySelector("summary").textContent)) d.open = true;
  });
}

function renderInbox() {
  const view = el("view-inbox");
  const draft = keep(view);
  const open = state.proposals.filter(p => p.status === "open")
    .sort((a, b) => (URGENCY_RANK[a.urgency] ?? 9) - (URGENCY_RANK[b.urgency] ?? 9) || String(b.asked_at || "").localeCompare(String(a.asked_at || "")));
  const answered = state.proposals.filter(p => p.status === "answered");
  const closed = state.proposals.filter(p => ["accepted", "withdrawn", "superseded"].includes(p.status));
  const live = answered.concat(open);
  const html = [];

  if (!live.length) {
    html.push(emptyState("proposals", state.ready ? "Nothing is waiting on you." : "Reading the console…"));
  } else {
    live.forEach((p, i) => html.push(proposalCard(p, i)));
  }
  if (closed.length) {
    html.push('<details class="arch"><summary>' + closed.length + " decided · archived</summary><div class=\"arch__list\">" +
      closed.sort((a, b) => String(b.asked_at || "").localeCompare(String(a.asked_at || ""))).map(p =>
        '<div class="arch__row"><span>' + esc(p.status) + "</span><b>" + esc(p.title || p.id) + "</b><span>" +
        esc((p.outcome && p.outcome.adr) || (p.answer && p.answer.choice) || "") + "</span></div>").join("") +

function proposalCard(p, i) {

  const body = [

      '<div class="opt__label">' + esc(o.label || o.key) + (o.recommended ? '<span class="rec">recommended</span>' : "") + "</div>" +
      (o.summary ? '<div class="opt__sum">' + esc(o.summary) + "</div>" : "") +
      (o.tradeoffs ? '<div class="opt__trade">' + esc(o.tradeoffs) + "</div>" : "") +
      "</div></label>").join("") + "</div>" +
      '<div class="field" style="margin-top:var(--space-5)"><textarea id="notes-' + esc(p.id) + '" placeholder="Anything the session should know…"></textarea></div>' +
      '<div class="actions" style="margin-top:var(--space-5)"><button class="btn" type="submit"><span>Record decision</span></button>' +
      '<button class="btn btn--ghost" type="button" data-withdraw="' + esc(p.id) + '">No longer matters</button></div></form>');

  }

  return '<article class="card' + (p.urgency === "blocking" && !answered ? " card--live" : "") +
    '" data-anchors="' + esc(JSON.stringify(p.anchors || [])) + '" style="animation-delay:' + (i * 60) + 'ms">' +
    body.filter(Boolean).join("") + "</article>";
}

function wireAnswerForm(form) {
  const id = form.dataset.proposal;
  form.addEventListener("submit", e => {
    e.preventDefault();
    const picked = form.querySelector("input[type=radio]:checked");
    if (!picked) return;
    const notes = (el("notes-" + id) || {}).value || "";
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true;
    write(id, {
      status: "answered",
      answer: {choice: picked.value, notes: notes.trim(), answered_at: new Date().toISOString()}
    }, "Decision recorded", btn);
  });
  const w = form.querySelector("[data-withdraw]");
  if (w) w.addEventListener("click", () => {
    w.disabled = true;
    write(id, {status: "withdrawn", answer: {choice: "", notes: "No longer matters.", answered_at: new Date().toISOString()}}, "Withdrawn", w);
  });
}

function write(id, patch, ok, btn) {
  if (!state.db) return;
  state.db.doc("proposals/" + id).update(patch)
    .then(() => toast(ok, "The next session picks it up."))
    .catch(err => {
      if (btn) btn.disabled = false;
      toast("Not recorded", (err && (err.message || err.code)) || "The write was refused.", "warning");
    });
}

/* A map's staleness is computed by `arty sync` into the snapshot; a row still
   saying "stale" was written by a schema-3 sync, before that. */
function mapState(m) {
  const st = state.snap && state.snap.maps && state.snap.maps[m.id];
  if (m.status === "retired") return {stale: false, by: [], count: 0};
  if (st) return st;
  return {stale: m.status === "stale", by: m.invalidated_by || [], count: m.invalidated_count || 0};
}
const isStale = m => m.status !== "retired" && mapState(m).stale;

  const view = el("view-maps");
  const live = state.maps.filter(m => m.status !== "retired")
    .sort((a, b) => (isStale(a) ? 0 : 1) - (isStale(b) ? 0 : 1) || String(a.title || "").localeCompare(String(b.title || "")));
  const retired = state.maps.filter(m => m.status === "retired");
  const draft = keep(view);
  const html = [];
  if (!live.length) {
    html.push(emptyState("maps", state.ready ? "No maps are registered." : "Reading the console…"));
  } else {
    html.push('<div class="index">' + live.map((m, i) => mapRow(m, i)).join("") + "</div>");
  }
  if (retired.length) html.push(archive(retired, "retired"));
  view.innerHTML = html.join("");
  restore(view, draft);
  wireRelations(view);
  drawDiagrams(view);
}

function mapRow(m, i) {
  const st = mapState(m), stale = st.stale;
  const counts = m.claims || {};
  const total = CLAIMS.reduce((n, k) => n + (Number(counts[k]) || 0), 0);
  const bar = total
    ? '<div class="bar">' + CLAIMS.map(k => {
        const n = Number(counts[k]) || 0;
        return n ? '<span class="s-' + k + '" style="width:' + (n / total * 100) + '%"></span>' : "";
      }).join("") + "</div>" +
      '<div class="legend">' + CLAIMS.filter(k => Number(counts[k])).map(k =>
        '<span><i style="background:' + (k === "unverified" ? "var(--stone-400)" : "var(--" + CLAIM_TONE[k] + ")") + '"></i>' +
        counts[k] + " " + k + "</span>").join("") + "</div>"
    : isInline(m) ? "" : '<div class="legend"><span>no claims recorded</span></div>';

  const why = stale && st.by.length
    ? '<div class="row__why">' + st.by.slice(0, 5).map(c =>
        '<span class="commit"><b>' + esc(c.commit || "") + "</b> " + esc(c.subject || "") + "</span>").join("") +
      (st.count > st.by.length ? '<span class="commit">and ' + (st.count - st.by.length) + " more</span>" : "") + "</div>"
    : "";

  const own = isInline(m);
  return (own ? '<div class="row"' : '<a class="row" href="' + esc(m.url || "#") + '" target="_blank" rel="noopener"') +
    ' data-anchors="' + esc(JSON.stringify(m.anchors || [])) + '">' +
    '<span class="row__i">' + String(i + 1).padStart(2, "0") + "</span>" +
    '<div class="row__main"><span class="row__t">' + esc(m.title || m.id) + (own ? "" : ' <span class="ext">&#8599;</span>') + "</span>" +
    (m.purpose ? '<span class="row__sub">' + esc(m.purpose) + "</span>" : "") +
    (m.anchors && m.anchors.length ? tags(m.anchors) : "") + why + inlineBody(m) + "</div>" +
    '<div class="row__side">' + (stale ? badge("stale", "danger", {dot: true}) : badge("current", "success", {dot: true})) +
    '<div class="claims">' + bar + "</div>" +
    '<span class="meta">' + (m.refreshed_at ? "refreshed " + esc(ago(m.refreshed_at)) : "") + "</span></div>" + (own ? "</div>" : "</a>");
}

function renderReports() {

      ' data-anchors="' + esc(JSON.stringify(r.anchors || [])) + '">' +

function archive(rows, word) {
  return '<details class="arch"><summary>' + rows.length + " " + word + " · archived</summary><div class=\"arch__list\">" +
    rows.map(r => '<div class="arch__row"><span>' + esc(r.status || "") + "</span><b>" + esc(r.title || r.id) + "</b>" +
      (r.url ? '<a class="meta" href="' + esc(r.url) + '" target="_blank" rel="noopener">open <span class="ext">&#8599;</span></a>' : "<span></span>") +
      "</div>").join("") + "</div></details>";
}

/* —— time and version, as the page says them —— */
function rel(v) {
  const t = new Date(v).getTime();
  if (!v || isNaN(t)) return "";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if (h < 24) return h + " h ago";
  const d = Math.round(h / 24);
  if (d === 1) return "yesterday";
  if (d < 30) return d + " days ago";
  return fmtDate(v);
}
function day(v) {
  const d = toDate(v);
  if (isNaN(d)) return "";
  const o = {day: "numeric", month: "short"};
  if (d.getFullYear() !== new Date().getFullYear()) o.year = "2-digit";
  return d.toLocaleDateString("en-GB", o);
}
function stamp(v) {
  const d = new Date(v);
  if (isNaN(d)) return "";
  return d.toLocaleDateString("en-GB", {day: "numeric", month: "short", year: "numeric"}) + " " +
    d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"});
}
const vstr = v => Array.isArray(v) ? v.join(".") : "";
const unver = s => String(s || "").replace(/^\[\d+\.\d+\.\d+\]\s*/, "");
function verHTML(v) {
  return Array.isArray(v) ? '<span class="br">[</span>' + esc(vstr(v)) + '<span class="br">]</span>' : "";
}
function vrange(f) {
  const a = vstr(f.v0), b = vstr(f.v1);
  return a === b ? a : a + " – " + b;
}
function pane(title, body, more) {
  return '<section class="pane"><div class="pane__h"><h2>' + esc(title) + "</h2>" + (more || "") + "</div>" + body + "</section>";
}

/* —— markdown: whole docky files, through marked and DOMPurify when they load —— */
function mdHTML(src) {
  if (window.marked && window.DOMPurify) {
    try { return DOMPurify.sanitize(marked.parse(String(src || ""), {gfm: true})); } catch (e) { /* fall through */ }
  }
  return md(src);
}
function mdInline(src) {
  if (window.marked && window.DOMPurify) {
    try { return DOMPurify.sanitize(marked.parseInline(String(src || ""))); } catch (e) { /* fall through */ }
  }
  return inline(src);
}
function prose(src, base) {
  return '<div class="prose" data-base="' + esc(base || "") + '">' + mdHTML(src) + "</div>";
}
function resolvePath(base, href) {
  const dir = base && base.includes("/") ? base.slice(0, base.lastIndexOf("/") + 1) : "";
  const out = [];
  (href.startsWith("/") ? href.slice(1) : dir + href).split("/").forEach(p => {
    if (p === "..") out.pop(); else if (p && p !== ".") out.push(p);
  });
  return out.join("/");
}
/* Links between docs stay in the console; links to code go to the forge when
   the repository has one; images can't load here, so they say what they were. */
function hydrate(scope) {
  const s = state.snap;
  scope.querySelectorAll("[data-base]").forEach(root => {
    const base = root.dataset.base;
    root.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href") || "";
      if (a.dataset.doc || a.dataset.commit) return;
      if (/^https?:\/\//i.test(href)) { a.target = "_blank"; a.rel = "noopener"; a.classList.add("is-out"); return; }
      if (/^[a-z]+:/i.test(href) || href.startsWith("#")) return;
      let path;
      try { path = resolvePath(base, decodeURI(href.split("#")[0])); } catch (e) { path = resolvePath(base, href.split("#")[0]); }
      if (s && s.byPath[path]) { a.setAttribute("href", "#docs"); a.dataset.doc = path; return; }
      if (s && s.repo.web && s.repo.head) {
        a.href = s.repo.web + "/blob/" + s.repo.head.h + "/" + path;
        a.target = "_blank"; a.rel = "noopener"; a.classList.add("is-out");
        return;
      }
      a.removeAttribute("href");
      a.classList.add("is-dead");
      a.title = path + " is not part of the snapshot";
    });
    root.querySelectorAll("img").forEach(img => {
      const box = document.createElement("div");
      box.className = "img";
      box.textContent = "image · " + (img.getAttribute("alt") || "untitled") + " · " + resolvePath(base, img.getAttribute("src") || "");
      img.replaceWith(box);
    });
    root.querySelectorAll("table").forEach(t => {
      if (t.parentElement.classList.contains("tbl")) return;
      const wrap = document.createElement("div");
      wrap.className = "tbl";
      t.replaceWith(wrap);
      wrap.appendChild(t);
    });
    root.querySelectorAll("pre > code.language-mermaid").forEach(code => {
      const pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.textContent = code.textContent;
      code.parentElement.replaceWith(pre);
    });
    root.querySelectorAll("input[type=checkbox]").forEach(i => { i.disabled = true; });
  });
  drawDiagrams(scope);
}

/* —— the snapshot: git and docs/, computed by `arty sync`, never by hand —— */
const DOC_GROUPS = [
  ["Overview", d => d.kind === "index" || d.kind === "readme"],
  ["Next steps", d => d.kind === "todo" || d.kind === "task"],
  ["Decisions", d => d.kind === "adr"],
  ["Changes", d => d.kind === "changelog"],
  ["Analysis", d => d.kind === "analysis"],
  ["Other", d => d.kind === "other"],
  ["Stale", d => d.kind === "stale"]
];
const KIND = {readme: "readme", index: "index", todo: "to do", task: "task detail", adr: "decision", changelog: "change",
  analysis: "analysis", stale: "stale", other: "doc"};

function setSnap(s, at) {
  s.byHash = {};
  s.commits.forEach((c, i) => { c.i = i; s.byHash[c.h] = c; });
  s.byPath = {};
  s.docs.forEach(d => { s.byPath[d.path] = d; });
  s.featureOf = {};
  s.byFeature = {};
  s.features.forEach(f => { s.byFeature[f.key] = f; f.commits.forEach(h => { s.featureOf[h] = f; }); });
  s.refsAt = {};
  s.refs.forEach(r => { (s.refsAt[r.hash] = s.refsAt[r.hash] || []).push(r); });
  // HEAD's first-parent line inside the window, newest first: the axis "as of" moves along.
  s.line = [];
  const seen = new Set();
  let h = s.repo.head && s.repo.head.h;
  while (h && s.byHash[h] && !seen.has(h)) { seen.add(h); s.line.push(s.byHash[h]); h = s.byHash[h].p[0]; }
  s.lineIdx = {};
  s.line.forEach((c, i) => { s.lineIdx[c.h] = i; });
  s.graph = layoutGraph(s);
  state.snap = s;

function docLinks(paths) {
  const s = state.snap;
  const docs = paths.map(p => s.byPath[p]).filter(Boolean);
  if (!docs.length) return "";
  return '<div class="links">' + docs.map(d => '<button class="dl" type="button" data-doc="' + esc(d.path) + '"><small>' + esc(KIND[d.kind] || "doc") +
    "</small><span>" + esc(d.title) + "</span></button>").join("") + "</div>";
}
function commitDetail(c) {
  const s = state.snap, f = s.featureOf[c.h], web = s.repo.web;
  const maxN = Math.max(1, ...c.files.map(x => (x[1] || 0) + (x[2] || 0)));
  const files = c.files.map(x => {
    const a = x[1], d = x[2], n = (a || 0) + (d || 0);
    return '<div class="file"><span class="file__p" title="' + esc(x[0]) + '"><bdi>' + esc(x[0]) + "</bdi></span>" +
      '<span class="file__n">' + (a == null ? "bin" : '<span class="a">+' + a + '</span> <span class="d">−' + d + "</span>") + "</span>" +
      '<span class="file__bar">' + (n ? '<span class="a" style="width:' + ((a || 0) / maxN * 100) + '%"></span><span class="d" style="width:' + ((d || 0) / maxN * 100) + '%"></span>' : "") + "</span></div>";
  }).join("");
  return '<div class="card__head">' + (c.v ? '<span class="insp__v">[' + esc(vstr(c.v)) + "]</span>" : "") +
    (f ? '<button class="chip" type="button" data-feature="' + esc(f.key) + '">' + esc(f.name || "version " + f.key) + "</button>" : "") + refChips(c.h) + "</div>" +
    '<h2 class="insp__t">' + esc(unver(c.s)) + "</h2>" +
    '<dl class="kv"><dt>commit</dt><dd>' + (web ? '<a class="chip" href="' + esc(web + "/commit/" + c.h) + '" target="_blank" rel="noopener">' + esc(c.h) + " ↗</a>" : esc(c.h)) + "</dd>" +
    "<dt>author</dt><dd>" + esc(c.a) + "</dd><dt>when</dt><dd>" + esc(stamp(c.t)) + " · " + esc(rel(c.t)) + "</dd>" +
    (c.p.length ? "<dt>" + (c.p.length > 1 ? "merges" : "parent") + "</dt><dd>" + c.p.map(p => s.byHash[p]
      ? '<button class="chip" type="button" data-commit="' + esc(p) + '">' + esc(s.byHash[p].v ? vstr(s.byHash[p].v) : p.slice(0, 7)) + "</button>"
      : '<span class="meta">' + esc(p.slice(0, 7)) + "</span>").join("") + "</dd>" : "") +
    "<dt>size</dt><dd>" + c.nf + (c.nf === 1 ? " file" : " files") + ' · <span style="color:var(--success)">+' + c.add + '</span> <span style="color:var(--danger)">−' + c.del + "</span></dd></dl>" +
    (c.b ? '<div class="insp__body">' + esc(c.b) + "</div>" : "") +
    (c.docs ? '<div class="pane"><div class="pane__h"><h2>Docs in this commit</h2></div>' + docLinks(c.docs) + "</div>" : "") +
    (c.files.length ? '<div class="pane"><div class="pane__h"><h2>Files</h2>' + (c.nf > c.files.length ? '<span class="note">' + c.files.length + " of " + c.nf + "</span>" : "") +
      '</div><div class="files">' + files + "</div></div>" : "") +
    '<div class="actions"><button class="btn" type="button" data-asof="' + esc(c.h) + '"><span>Read the docs as of this commit</span></button></div>';
}
function featureDetail(f) {
  const s = state.snap;
  const first = s.byHash[f.first], last = s.byHash[f.last];
  return '<div class="card__head"><span class="insp__v">' + esc(vrange(f)) + '</span><span class="st st--' + esc(f.status) + '">' + esc(f.status) + "</span></div>" +
    '<h2 class="insp__t">' + esc(f.name || "Version " + f.key) + "</h2>" +
    '<dl class="kv"><dt>commits</dt><dd>' + f.commits.length + "</dd><dt>span</dt><dd>" + esc(stamp(f.t0)) + " → " + esc(stamp(f.t1)) + "</dd>" +
    (f.branches.length ? "<dt>branch</dt><dd>" + f.branches.map(b => '<span class="chip chip--branch">' + esc(b) + "</span>").join("") + "</dd>" : "") +
    "<dt>status</dt><dd>" + esc(f.status === "merged" ? "reachable from " + s.repo.default : f.status === "open" ? "on a branch, not in " + s.repo.default : "on no branch, not in " + s.repo.default) + "</dd></dl>" +
    (first ? '<div class="insp__body">' + esc(unver(first.s)) + "</div>" : "") +
    (f.docs.length ? '<div class="pane"><div class="pane__h"><h2>Docs it touched</h2></div>' + docLinks(f.docs) + "</div>" : "") +
    '<div class="actions">' + (first ? '<button class="btn" type="button" data-commit="' + esc(first.h) + '"><span>First commit</span></button>' : "") +
    (last && last !== first ? '<button class="btn btn--ghost" type="button" data-commit="' + esc(last.h) + '"><span>Latest commit</span></button>' : "") + "</div>";
}

/* —— navigation between views —— */
function openDoc(path) {
  state.doc = path;
  state.docOpened = true;
  if (state.asOf && state.snap && !existsAt(state.snap.byPath[path], asOfCommit())) state.asOf = null;
  setView("docs");
  renderDocs();
  window.scrollTo({top: 0});
}
function openCommit(h, fromGraph) {
  const c = findCommit(h);
  if (!c) return;
  state.commit = c.h;
  if (!fromGraph) setView("history");
  renderHistory();
  const row = el("row-" + c.h);
  if (row && !fromGraph) row.scrollIntoView({block: "center"});
  if (row && fromGraph) row.focus({preventScroll: true});
  if (window.matchMedia && window.matchMedia("(max-width:980px)").matches && fromGraph) el("insp").scrollIntoView({block: "start"});
}
function openFeature(key) {
  state.feature = state.feature === key && state.view === "history" ? null : key;
  state.commit = null;
  setView("history");
  renderHistory();
  const f = state.feature && state.snap.byFeature[state.feature];
  const row = f && el("row-" + f.last);
  if (row) row.scrollIntoView({block: "center"});
}
document.addEventListener("click", e => {
  const t = e.target.closest && e.target.closest("[data-doc],[data-commit],[data-feature],[data-goto],[data-asof],[data-brief],[data-tag],[data-epic],[data-card],[data-col],[data-board-all],[data-board-asof]");
  if (!t || t.closest(".fig__btn")) return;
  const d = t.dataset;
  if (d.doc != null) { e.preventDefault(); openDoc(d.doc); }
  else if (d.commit != null) { e.preventDefault(); openCommit(d.commit, !!t.closest("#graph")); }
  else if (d.feature != null) { e.preventDefault(); openFeature(d.feature); }
  else if (d.goto != null) { e.preventDefault(); setView(d.goto); window.scrollTo({top: 0}); }
  else if (d.asof != null) {
    e.preventDefault(); state.asOf = d.asof || null;
    if (t.closest("#view-board")) { renderBoard(); settleBoard(); } else { setView("docs"); renderDocs(); }
    window.scrollTo({top: 0});
  }
  else if (d.boardAsof != null) { state.asOf = d.boardAsof; renderBoard(); window.scrollTo({top: 0}); }
  else if (d.tag != null) { state.boardTag = state.boardTag === d.tag ? null : d.tag; if (state.view !== "board") setView("board"); renderBoard(); settleBoard(); }
  else if (d.epic != null) { state.boardEpic = state.boardEpic === d.epic ? null : d.epic; if (state.view !== "board") setView("board"); renderBoard(); settleBoard(); }
  else if (d.card != null) showCard(d.card);
  else if (d.col != null) jumpToColumn(d.col);
  else if (d.boardAll != null) { state.boardAll = true; renderBoard(); }
  else if (d.brief != null) { state.brief = Math.max(0, Math.min(((state.snap && state.snap.briefs) || []).length - 1, state.brief + Number(d.brief))); renderNow(); }
});
document.addEventListener("keydown", e => {
  if (state.view !== "history" || !state.snap || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("input,textarea,select")) return;
  const step = e.key === "j" || e.key === "ArrowDown" ? 1 : e.key === "k" || e.key === "ArrowUp" ? -1 : 0;
  if (!step) return;
  e.preventDefault();
  const list = state.snap.commits;
  const cur = state.commit ? state.snap.byHash[state.commit].i : -1;
  const next = list[Math.min(list.length - 1, Math.max(0, cur + step))];
  if (next) { openCommit(next.h, true); const row = el("row-" + next.h); if (row) row.scrollIntoView({block: "nearest"}); }
});

/* —— chrome —— */
function renderChrome() {
  const s = state.snap;
  const name = (s && s.project) || (state.project && state.project.project) || document.title.replace(/\s*Console\s*$/, "") || "Console";
  el("wordmark").innerHTML = esc(name) + '<span class="stop">.</span>';
  const open = state.proposals.filter(p => p.status === "open" || p.status === "answered").length;
  el("n-inbox").textContent = open ? String(open) : "";
  el("n-docs").textContent = s && s.docs.length ? String(s.docs.length) : "";
  const bd = boardOf(s);
  el("tab-board").hidden = !bd;
  el("n-board").textContent = bd ? String(bd.cards.length) : "";
  el("n-history").textContent = s && s.features.length ? String(s.features.length) : "";
  const exh = state.maps.filter(m => m.status !== "retired").length + state.reports.filter(r => r.status === "current").length;
  el("n-exhibits").textContent = exh ? String(exh) : "";
  const bits = [];
  if (state.snapAt) bits.push("synced " + rel(state.snapAt));
  const stale = state.maps.filter(isStale).length;
  if (stale) bits.push(stale + (stale === 1 ? " stale map" : " stale maps"));
  if (!state.canEdit && state.ready && state.db) bits.push("read only");
  el("stamp").textContent = bits.join(" · ") || (state.ready ? "nothing synced yet" : "connecting");
}

function renderAll() {
  renderChrome(); renderNow(); renderBoard(); renderDocs(); renderHistory(); renderInbox(); renderMaps(); renderReports();
}

function placeIndicator() {
  const tab = el("tab-" + state.view), ind = el("tab-ind");
  ind.style.width = tab.offsetWidth + "px";
  ind.style.transform = "translateX(" + tab.offsetLeft + "px)";
  document.documentElement.style.setProperty("--hdr-h", (el("hdr").offsetHeight + 24) + "px");
}
function setView(name) {
  if (!VIEWS.includes(name)) name = "now";
  state.view = name;
  VIEWS.forEach(v => {
    el("view-" + v).hidden = v !== name;
    el("tab-" + v).setAttribute("aria-selected", String(v === name));
  });
  placeIndicator();
  if (name === "board") settleBoard();
  try { history.replaceState(null, "", "#" + name); } catch (e) { /* the frame may refuse; the tab still switches */ }
  drawDiagrams(el("view-" + name));
}

function toast(title, line, tone) {
  const node = document.createElement("div");
  node.className = "toast" + (tone ? " toast--" + tone : "");
  node.innerHTML = "<b>" + esc(title) + "</b>" + (line ? "<span>" + esc(line) + "</span>" : "");
  el("toasts").appendChild(node);
  setTimeout(() => node.remove(), 5200);
}

/* —— boot —— */
el("tabs").addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) setView(tab.dataset.view);
});
window.addEventListener("resize", placeIndicator);
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  mq.addEventListener && mq.addEventListener("change", redrawDiagrams);
}
new MutationObserver(redrawDiagrams).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
renderAll();
setView((location.hash || "").slice(1) || "now");
setInterval(renderChrome, 60000);

/* Outside claude.ai (a local look at the page) the snapshot is a file beside it. */
function loadLocal(note) {
  fetch("snapshot.json").then(r => r.ok ? r.json() : null).then(s => {
    if (s) setSnap(s);
    else { state.snapNote = note; renderAll(); }
  }).catch(() => { state.snapNote = note; renderAll(); });
}

(async () => {
  const db = window.claude && await window.claude.use("db");
  const user = window.claude && await window.claude.use("user");
  state.canEdit = !!(user && user.canEdit && user.canEdit());
  state.ready = true;
  if (!db) { loadLocal("The console reads the repository as the signed-in viewer, and nobody is signed in here."); return; }
  state.db = db;
  renderAll();
  db.doc("meta/project").onSnapshot(snap => { state.project = snap.data() || null; renderChrome(); }, () => {});
  db.collection("snapshot").onSnapshot(snap => readSnapshot(snap.docs),
    err => toast("Could not read the snapshot", (err && err.message) || "", "warning"));
  COLLECTIONS.forEach(name => {
    db.collection(name).onSnapshot(snap => {
      state[name] = snap.docs.map(d => Object.assign({id: d.id}, d.data() || {}));
      renderAll();
    }, err => toast("Could not read " + name, (err && err.message) || "", "warning"));
  });
})();
</script>
